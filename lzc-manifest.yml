application:
  subdomain: pansou
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://pansou:80/

services:
  pansou:
    # upstream: ghcr.io/fish2018/pansou-web:latest（前后端集成，无版本 tag）
    image: ghcr.nju.edu.cn/fish2018/pansou-web:latest@sha256:991624ffcab4f04d0cd059bdaa8e6dbb2cd64a2424feb5f21f79e911194c650a
    environment:
      - TZ=Asia/Shanghai
      # 数据目录（缓存/日志统一在 /app/data）
      - CACHE_PATH=/app/data/cache
      - LOG_PATH=/app/data/logs
      # 默认 TG 频道与插件已内置于镜像，无需覆盖
      # 认证（可选）：默认关闭。如需开启，设置向导填写账号密码
      - AUTH_ENABLED={{ .U.auth_enabled }}
      - AUTH_USERS={{ .U.auth_users }}
      - AUTH_JWT_SECRET={{ stable_secret "jwt_secret" }}
      - AUTH_TOKEN_EXPIRY=24
    binds:
      - /lzcapp/var/pansou:/app/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
